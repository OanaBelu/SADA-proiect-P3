# Configurația implicită pentru P3. Valorile marcate „exemplu” se revăd și se justifică în raport.

experiment:
  runner: "sada.p3.experiments:run_one"
  base_seed: 3000
  n_runs: 20

data:
  graph: data/p3_retea/retea.graphml
  od_pairs: data/od_pairs.csv
  group_scenarios: data/p3_retea/scenarii_defect.json
  importance: data/p3_retea/importanta_muchii.csv   # edge betweenness exact; în kit nu există cheia, citiți-o voi

od:
  n_pairs: 300               # 200-500
  seed: 42
  population_attr: population
  weight: length             # sau travel_time
  priority_file: data/p3_retea/prioritare.csv       # restul secțiunii od rămâne ca în kit

failures:
  max_frac: 0.10             # până la 10% din muchii
  steps: 10                  # eliminare progresivă în 10 trepte
  importance_k: 500          # eșantionare pentru edge betweenness
  recompute_importance: false

scenarios:
  aleator:      {failure: random}
  tintit:       {failure: targeted}
  inundatie:    {failure: group, group: coridor_inundatie}
  rauri:        {failure: group, group: traversari_rau}
  central:      {failure: group, group: coridor_central}

variants:
  fara_recuperare: {levels: none}
  doar_nivel2:     {levels: level2}
  nivele_1_3:      {levels: all}

report:                    # pentru scripts/report_numbers.py
  baseline: fara_recuperare
  adaptive: [doar_nivel2, nivele_1_3]

figures:
  metrics:
    - {name: od_connected_pct, label: "Perechi OD conectate", unit: "%", better: higher}
    - {name: cost_increase_pct, label: "Creșterea costului mediu", unit: "%", better: lower}
    - {name: backup_routes_used, label: "Rute de rezervă folosite", unit: "", decimals: 0, better: higher}
    - {name: recovery_steps, label: "Timp de recuperare", unit: "pași", better: lower}

osm:
  # Centrul Timișoarei (Piața Victoriei). Raza de 2500 m dă ~1100 de noduri după unirea
  # intersecțiilor (fișa cere 500–3000; la 1500 m ieșeau doar 463).
  center: [45.7537, 21.2257]   # lat, lon
  dist_m: 2500
  network_type: drive
  consolidate_tolerance_m: 15
  out: data/raw/retea_osm.graphml

env:
  required_modules: [networkx, osmnx]
  expected_files: [data/p3_retea, data/od_pairs.csv]

dataset:                     # scripts/build_dataset.py (în locul pachetului p3_retea/)
  m2_per_person: 30          # suprafață desfășurată locuibilă pe locuitor (estimare)
  river_name: Bega
  flood_phases_m: [40, 80, 120]   # inundația crește în trei faze: muchii la ≤ 40, 80, 120 m de albie
  flood_stretch_lon: [21.2257, 21.30]   # tronsonul inundat: aval de Piața Victoriei (estul orașului)
  crossings_radius_m: 1000        # podurile închise: cele din centru
  central_axis: [[45.7580, 21.2290], [45.7537, 21.2257], [45.7505, 21.2240]]  # P-ța Unirii, P-ța Victoriei, Catedrala
  central_buffer_m: 150
  station: [45.7506, 21.2077]     # Gara Timișoara Nord
  max_hospitals: 6
  hospital_min_area_m2: 3000   # amenity=hospital include și cabinete; păstrăm doar spitalele mari
  pairs_per_hospital: 5
  seed: 7
